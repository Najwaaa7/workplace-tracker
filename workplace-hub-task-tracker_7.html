<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workplace Hub — Task Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1c2633; --blue:#001b72; --aqua:#0BC0FF; --purple:#7122f4;
  --bg:#f5f3fc; --card:#fff; --ink:#1c2633; --muted:#6b7385; --line:#e5e2f2;
  --done:#3aa316; --prog:#0BC0FF; --not:#8a91a3;
  --shadow:0 1px 3px rgba(28,38,51,.06),0 6px 18px rgba(28,38,51,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
h1,h2,h3{font-family:'Sora',sans-serif}
button{font-family:inherit;cursor:pointer}

header{background:linear-gradient(120deg,var(--navy),#232f52 55%,var(--blue));color:#fff}
.hd{max-width:900px;margin:0 auto;padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.hd small{display:block;color:var(--aqua);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:.66rem;margin-bottom:3px}
.hd h1{font-size:1.2rem}
.hd-user{display:flex;align-items:center;gap:10px}
.hd-user .who{font-family:'Sora';font-weight:600;font-size:.9rem}
.chg{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:7px 13px;font-size:.76rem;font-weight:600}

nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.nv{max-width:900px;margin:0 auto;padding:0 20px;display:flex;gap:4px}
.tab{border:none;background:none;padding:13px 14px 11px;font-size:.88rem;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tab.active{color:var(--blue);border-bottom-color:var(--aqua)}

main{max-width:900px;margin:0 auto;padding:22px 20px 80px}

/* ---- select leader ---- */
.pick{max-width:640px;margin:34px auto;text-align:center}
.pick .dot{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,var(--purple),var(--aqua));margin:0 auto 16px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Sora';font-weight:700;font-size:1.35rem}
.pick h2{font-size:1.25rem;margin-bottom:5px}
.pick p{color:var(--muted);font-size:.86rem;margin-bottom:24px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pick-btn{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:16px;font-weight:600;font-size:.88rem;text-align:left;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;transition:border-color .15s}
.pick-btn:hover{border-color:var(--purple)}
.pick-btn .av{width:38px;height:38px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--aqua));color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;font-size:.82rem}
.pick-btn small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}

/* ---- summary ---- */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.sc{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:13px 16px;border-top:3px solid var(--aqua)}
.sc b{display:block;font-family:'Sora';font-size:1.3rem;color:var(--blue)}
.sc span{font-size:.7rem;color:var(--muted)}
.sc.g{border-top-color:var(--done)} .sc.p{border-top-color:var(--purple)}

/* ---- task cards ---- */
.tasks{display:flex;flex-direction:column;gap:12px}
.tc{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;border-left:4px solid var(--line)}
.tc.s-prog{border-left-color:var(--prog)}
.tc.s-done{border-left-color:var(--done)}
.tc-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.tc h3{font-size:.94rem}
.tc .d{font-size:.79rem;color:var(--muted);margin-top:3px;max-width:560px}
.pill{font-size:.7rem;font-weight:700;border-radius:999px;padding:4px 12px;color:#fff;white-space:nowrap}
.pill.not{background:var(--not)} .pill.prog{background:var(--prog)} .pill.done{background:var(--done)}
.row{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.row select{border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:#fbfaff;font-size:.84rem;font-weight:600}
.row input[type=range]{flex:1;min-width:140px;accent-color:var(--purple)}
.row .pv{font-family:'Sora';font-weight:700;font-size:.84rem;color:var(--blue);min-width:42px;text-align:right}
.tc textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fbfaff;resize:vertical;min-height:46px;font-size:.84rem;margin-top:10px;font-family:inherit}

/* ---- dashboard ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.dc{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:16px;display:flex;gap:13px;align-items:center}
.ring{width:56px;height:56px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .pc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;font-size:.78rem;color:var(--blue)}
.dc h3{font-size:.88rem;line-height:1.3}
.dc .m{font-size:.74rem;color:var(--muted);margin-top:2px}
.bar{height:9px;border-radius:999px;background:var(--bg);overflow:hidden;flex:1;min-width:160px}
.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--purple),var(--aqua))}
.overall{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px;border-top:4px solid var(--aqua)}
.overall .big{font-family:'Sora';font-size:2rem;font-weight:700;color:var(--blue)}
.overall .l{font-size:.74rem;color:var(--muted)}
.sect{font-family:'Sora';font-size:1rem;font-weight:700;margin:22px 0 10px}

.note{background:#fff;border:1.5px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:.85rem}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--navy);color:#fff;padding:10px 20px;border-radius:999px;font-size:.84rem;font-weight:600;opacity:0;transition:all .3s;z-index:50}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
footer{max-width:900px;margin:0 auto;padding:0 20px 28px;font-size:.68rem;color:var(--muted);text-align:center}
@media(max-width:560px){.hd-user .who{display:none}}
</style>
</head>
<body>

<header><div class="hd">
  <div><small>Qiddiya · Workplace Division</small><h1>Workplace Hub — Task Tracker</h1></div>
  <div class="hd-user" id="hdUser"></div>
</div></header>

<nav id="navBar" style="display:none"><div class="nv" id="navTabs"></div></nav>

<main id="app"><div class="note">Loading…</div></main>

<footer>Workplace Hub Program · Task tracking only — no documents or confidential information.<br>Updates are shared and visible to all users of this tracker.</footer>
<div class="toast" id="toast"></div>

<script>
/* ============ TASKS PER FUNCTION ============ */
var FUNCTIONS = [
  {id:'ops',  name:'Workplace Operations'},
  {id:'hse',  name:'Workplace Health, Safety & Security'},
  {id:'tech', name:'Workplace Technical'},
  {id:'eff',  name:'Workplace Effectiveness'},
  {id:'exp',  name:'Workplace Experience'},
  {id:'sp',   name:'Workplace Supply Partnership'},
  {id:'rc',   name:'Workplace Residential Community'}
];
var STD = [
  {id:'content',  t:'Content Preparation', d:'Organise all function content under: Key Resources, Document Libraries, Operational Tools, Team & Governance.'},
  {id:'owner',    t:'Page Ownership Confirmation', d:'Confirm the Function Page Owner and one or two Page Contributors.'},
  {id:'workshop', t:'IT Workshop Attendance', d:'Attend the IT implementation workshop scheduled for your function.'},
  {id:'closure',  t:'Workshop Actions Closure', d:'Confirm all actions raised during the workshop are completed.'}
];
var EXTRA = {
  eff:[
    {id:'datalog', t:'Submit Data Log Requirements', d:'Submit Data Log requirements for Workplace-wide reporting.'},
    {id:'visual',  t:'Home Page Reporting — Visual Format', d:'Submit the proposed visual format for Home Page reporting (KPI and data requirements only).'},
    {id:'kpi',     t:'Confirm Workplace-wide KPI Requirements', d:'Confirm KPI requirements with all Workplace functions.'}
  ],
  sp:[
    {id:'vendor',    t:'Prepare Vendor Information', d:'Prepare vendor information records.'},
    {id:'contractor',t:'Prepare Contractor Information', d:'Prepare contractor information records.'},
    {id:'contracts', t:'Organise Contracts by Function', d:'Organise contracts by the Workplace function they support.'},
    {id:'versions',  t:'Confirm Latest Signed Contract Versions', d:'Verify each contract is the latest signed version.'}
  ]
};
function defs(fn){ return STD.concat(EXTRA[fn]||[]); }

var STATUSES = ['Not Started','In Progress','Completed'];
var KEY = 'wkh_tracker_v3';

/* ============ STATE ============ */
var state = null, me = null, view = 'my', storageOK = true, saveTimer = null;

/* safe storage wrapper — never throws, even if window.storage is unavailable */
var store = {
  get: async function(k, sh){ try{ return await window.storage.get(k, sh); }catch(e){ return null; } },
  set: async function(k, v, sh){ try{ await window.storage.set(k, v, sh); return true; }catch(e){ return false; } },
  del: async function(k){ try{ await window.storage['delete'](k); }catch(e){} }
};

function blank(){
  var s = {fns:{}};
  FUNCTIONS.forEach(function(f){
    s.fns[f.id] = {};
    defs(f.id).forEach(function(t){ s.fns[f.id][t.id] = {st:'Not Started', pr:0, note:''}; });
  });
  return s;
}

async function load(){
  state = blank();
  try{
    var r = await store.get(KEY, true);
    if(r && r.value){
      var saved = JSON.parse(r.value);
      FUNCTIONS.forEach(function(f){
        defs(f.id).forEach(function(t){
          if(saved.fns && saved.fns[f.id] && saved.fns[f.id][t.id]) state.fns[f.id][t.id] = saved.fns[f.id][t.id];
        });
      });
    }
  }catch(e){ /* first run or storage unavailable */ }
  var u = await store.get('wkh_me');
  if(u && u.value && state.fns[u.value]) me = u.value;
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    store.set(KEY, JSON.stringify(state), true).then(function(ok){
      if(!ok && storageOK){ storageOK=false; toast('Saving unavailable — changes are temporary'); }
    });
  }, 300);
}

/* ============ HELPERS ============ */
function fname(id){ for(var i=0;i<FUNCTIONS.length;i++) if(FUNCTIONS[i].id===id) return FUNCTIONS[i].name; return id; }
function initials(n){ return n.replace('Workplace ','').split(/[\s,&]+/).filter(Boolean).map(function(w){return w[0];}).slice(0,2).join('').toUpperCase(); }
function esc(s){ return (s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function pillClass(st){ return st==='Completed'?'done':(st==='In Progress'?'prog':'not'); }
function cardClass(st){ return st==='Completed'?'s-done':(st==='In Progress'?'s-prog':''); }
function fnStats(id){
  var ds = defs(id), done=0, sum=0;
  ds.forEach(function(t){ var x=state.fns[id][t.id]; if(x.st==='Completed')done++; sum+=(+x.pr||0); });
  return {total:ds.length, done:done, pct:Math.round(sum/ds.length)};
}

/* ============ RENDER ============ */
var app = document.getElementById('app');

function render(){
  var hd = document.getElementById('hdUser');
  document.getElementById('navBar').style.display = me? 'block':'none';
  if(me){
    hd.innerHTML = '<span class="who">'+esc(fname(me))+'</span><button class="chg" onclick="changeUser()">Change leader</button>';
    document.getElementById('navTabs').innerHTML =
      '<button class="tab '+(view==='my'?'active':'')+'" onclick="go(\'my\')">My Tasks</button>'+
      '<button class="tab '+(view==='dash'?'active':'')+'" onclick="go(\'dash\')">Dashboard</button>';
  } else hd.innerHTML='';
  if(!me) renderPick();
  else if(view==='my') renderMy();
  else renderDash();
}
window.go = function(v){ view=v; render(); window.scrollTo({top:0}); };
window.changeUser = function(){ me=null; store.del('wkh_me'); render(); };

function renderPick(){
  var h = '<div class="pick"><div class="dot">W</div><h2>Select your function</h2>'+
    '<p>Choose your Workplace function to open your task list.</p><div class="pick-grid">';
  FUNCTIONS.forEach(function(f){
    var s = fnStats(f.id);
    h += '<button class="pick-btn" onclick="pick(\''+f.id+'\')"><span class="av">'+initials(f.name)+'</span>'+
         '<span>'+esc(f.name)+'<small>'+s.done+' of '+s.total+' tasks completed</small></span></button>';
  });
  h += '</div></div>';
  app.innerHTML = h;
}
window.pick = function(id){
  me = id;
  view = 'my';
  render();
  window.scrollTo({top:0});
  toast('Welcome, '+fname(id).replace('Workplace ','')+' Leader');
  store.set('wkh_me', id);
};

function renderMy(){
  var s = fnStats(me);
  var h = '<div class="sum">'+
    '<div class="sc p"><b>'+s.total+'</b><span>My tasks</span></div>'+
    '<div class="sc g"><b>'+s.done+'</b><span>Completed</span></div>'+
    '<div class="sc"><b>'+s.pct+'%</b><span>Overall progress</span></div>'+
  '</div><div class="tasks">';
  defs(me).forEach(function(t){
    var x = state.fns[me][t.id];
    h += '<div class="tc '+cardClass(x.st)+'">'+
      '<div class="tc-head"><div><h3>'+t.t+'</h3><div class="d">'+t.d+'</div></div>'+
      '<span class="pill '+pillClass(x.st)+'">'+x.st+'</span></div>'+
      '<div class="row">'+
        '<select onchange="setSt(\''+t.id+'\',this.value)">'+
          STATUSES.map(function(st){ return '<option'+(x.st===st?' selected':'')+'>'+st+'</option>'; }).join('')+
        '</select>'+
        '<input type="range" min="0" max="100" step="5" value="'+x.pr+'" '+
          'oninput="this.parentNode.querySelector(\'.pv\').textContent=this.value+\'%\'" '+
          'onchange="setPr(\''+t.id+'\',+this.value)">'+
        '<span class="pv">'+x.pr+'%</span>'+
      '</div>'+
      '<textarea placeholder="Notes… (no confidential information)" onchange="setNote(\''+t.id+'\',this.value)">'+esc(x.note)+'</textarea>'+
    '</div>';
  });
  h += '</div>';
  app.innerHTML = h;
}
window.setSt = function(tid,val){
  var x = state.fns[me][tid]; x.st = val;
  if(val==='Completed') x.pr = 100;
  if(val==='Not Started') x.pr = 0;
  save(); render();
};
window.setPr = function(tid,val){
  var x = state.fns[me][tid]; x.pr = val;
  if(val===100) x.st='Completed';
  else if(val>0 && x.st==='Not Started') x.st='In Progress';
  else if(val<100 && x.st==='Completed') x.st='In Progress';
  save(); render();
};
window.setNote = function(tid,val){ state.fns[me][tid].note = val; save(); };

function ring(pct){
  var r=23, c=2*Math.PI*r, off=c*(1-pct/100);
  return '<svg width="56" height="56" viewBox="0 0 56 56">'+
    '<circle cx="28" cy="28" r="'+r+'" fill="none" stroke="#efedf8" stroke-width="6"/>'+
    '<circle cx="28" cy="28" r="'+r+'" fill="none" stroke="#7122f4" stroke-width="6" stroke-linecap="round" '+
    'stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/></svg>';
}
function renderDash(){
  var tot=0, done=0, sum=0, n=0;
  FUNCTIONS.forEach(function(f){ var s=fnStats(f.id); tot+=s.total; done+=s.done; sum+=s.pct; n++; });
  var avg = Math.round(sum/n);
  var h = '<div class="overall"><div><div class="big">'+avg+'%</div><div class="l">Overall progress</div></div>'+
    '<div class="bar"><div class="fill" style="width:'+avg+'%"></div></div>'+
    '<div><b style="font-family:Sora;font-size:1.1rem;color:var(--blue)">'+done+' / '+tot+'</b><div class="l">Tasks completed</div></div></div>'+
    '<div class="sect">Progress by Function</div><div class="grid">';
  FUNCTIONS.forEach(function(f){
    var s = fnStats(f.id);
    h += '<div class="dc"><div class="ring">'+ring(s.pct)+'<div class="pc">'+s.pct+'%</div></div>'+
      '<div><h3>'+esc(f.name)+'</h3><div class="m">'+s.done+' of '+s.total+' tasks completed</div></div></div>';
  });
  h += '</div>';
  app.innerHTML = h;
}

var toastTimer;
function toast(m){
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

(async function(){
  try{ await load(); }catch(e){}
  render();
})();
</script>
</body>
</html>
